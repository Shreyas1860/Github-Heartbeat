name: Heartbeat

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          RUN=$(( $(date +%s) ))
          RANDOM_NUM=$(( RANDOM ))

          cat > README.md << EOF
          # 🤖 GitHub Heartbeat

          This repository updates itself automatically.

          ## Status

          Last Update:

          $(date -u)

          Run Number:

          $RUN

          Random Number:

          $RANDOM_NUM
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet && exit 0

          git commit -m "Heartbeat update"

          git push